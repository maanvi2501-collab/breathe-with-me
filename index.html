
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>You Are Here</title>
<style>
  :root{
    color-scheme: dark;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #app{
    position: fixed;
    inset: 0;
    height: 100dvh;
    width: 100vw;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    outline: none;
  }

  svg#rainbow{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }

  #rainbowGroup{
    transform-box: fill-box;
    transform-origin: 50% 50%;
    will-change: transform, filter;
  }

  #rainbowGroup path{
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 2600ms ease;
  }

  .center{
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    pointer-events: none;
    text-align: center;
    padding: 0 8vw;
  }

  #emoji{
    font-size: 22px;
    line-height: 1;
    opacity: 0.5;
    filter: grayscale(1) brightness(2.3) contrast(0.55);
    transition: opacity 900ms ease;
  }

  #label{
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 15px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.82);
    transition: opacity 650ms ease;
  }
  #label.hidden{ opacity: 0; }

  #finalText{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    opacity: 0;
    transition: opacity 2000ms ease;
  }
  #finalText.show{ opacity: 1; }

  #finalLine{
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "Helvetica Neue", Arial, sans-serif;
    font-weight: 200;
    font-size: 18px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.92);
  }

  #finalHeart{
    font-size: 19px;
    opacity: 0;
    transition: opacity 1600ms ease;
  }
  #finalHeart.show{ opacity: 1; }

  #introGlow{
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 1;
    transition: opacity 900ms ease;
  }
  #introGlow.hidden{ opacity: 0; }

  #introGlowInner, #introGlowRing{
    position: absolute;
    top: 50%;
    left: 50%;
    border-radius: 50%;
    will-change: transform, opacity;
  }

  #introGlowInner{
    width: min(64vw, 64vh, 340px);
    height: min(64vw, 64vh, 340px);
    background: radial-gradient(circle,
      rgba(255,255,255,0.60) 0%,
      rgba(255,255,255,0.34) 42%,
      rgba(255,255,255,0.10) 70%,
      rgba(255,255,255,0) 88%);
    transform: translate(-50%,-50%) scale(1);
  }

  #introGlowRing{
    width: min(64vw, 64vh, 340px);
    height: min(64vw, 64vh, 340px);
    border: max(2px, 0.4vw) solid rgba(255,255,255,0.9);
    box-shadow: 0 0 24px rgba(255,255,255,0.45);
    transform: translate(-50%,-50%) scale(1);
  }

  .sr-only{
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  @media (prefers-reduced-motion: reduce){
    #rainbowGroup path{ transition-duration: 1200ms; }
  }
</style>
</head>
<body>

<div id="app" role="button" tabindex="0" aria-label="Tap anywhere to begin the breathing experience">

  <svg id="rainbow" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <path id="measure" d=""></path>
    </defs>
    <g id="rainbowGroup"></g>
  </svg>

  <div id="introGlow" aria-hidden="true"><div id="introGlowInner"></div><div id="introGlowRing"></div></div>

  <div class="center">
    <div id="emoji">&#128543;</div>
    <div id="label">Tap to Breathe</div>
    <div id="finalText">
      <div id="finalLine">You Are Here</div>
      <div id="finalHeart">&#10084;&#65039;</div>
    </div>
  </div>

  <div id="live" class="sr-only" aria-live="polite"></div>
</div>

<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------------
  // Data
  // ---------------------------------------------------------------------
  var STAGES = [
    { label: "Your Kindness", color: "#8B5CF6" },
    { label: "Your Joy",      color: "#4F8CFF" },
    { label: "Your Friends",  color: "#22D3EE" },
    { label: "Your Family",   color: "#34D399" },
    { label: "Your Love",     color: "#FDE047" },
    { label: "Your Life",     color: "#FB923C" },
    { label: "Your Future",   color: "#F43F5E" }
  ];

  var SVGNS = "http://www.w3.org/2000/svg";

  // ---------------------------------------------------------------------
  // DOM refs
  // ---------------------------------------------------------------------
  var app        = document.getElementById("app");
  var svg        = document.getElementById("rainbow");
  var measure      = document.getElementById("measure");
  var group        = document.getElementById("rainbowGroup");
  var emojiEl      = document.getElementById("emoji");
  var labelEl      = document.getElementById("label");
  var finalText    = document.getElementById("finalText");
  var finalHeart   = document.getElementById("finalHeart");
  var liveEl       = document.getElementById("live");
  var introGlowEl  = document.getElementById("introGlow");
  var introGlowInnerEl = document.getElementById("introGlowInner");
  var introGlowRingEl  = document.getElementById("introGlowRing");

  // ---------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------
  var state = {
    stageIndex: -1,      // -1 = not started, 0..6 = revealed stages
    animating: false,    // true while a reveal transition is in-flight
    breathingStarted: false,
    finalTriggered: false
  };

  var reducedMotion = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var segments = [];   // { path, len }
  var viewW = 0, viewH = 0;

  // ---------------------------------------------------------------------
  // Geometry: a broad rainbow band — seven stacked, offset colour arcs
  // that together read as one wide sweep, rather than a single thin line.
  // ---------------------------------------------------------------------
  function polylineLength(pts){
    var total = 0;
    for (var i = 1; i < pts.length; i++){
      var dx = pts[i].x - pts[i-1].x;
      var dy = pts[i].y - pts[i-1].y;
      total += Math.sqrt(dx*dx + dy*dy);
    }
    return total;
  }

  function bandThicknessFor(w, h){
    var ref = Math.min(w, h);
    return Math.max(12, Math.min(30, ref * 0.026));
  }

  function rainbowPathD(w, h, topClearance){
    var ref = Math.min(w, h * 1.4);
    var extend = ref * 0.24;
    var leftX = -extend;
    var rightX = w + extend;
    var baseY = h * 0.72;
    var peakY = Math.max(topClearance, baseY - ref * 0.58);
    var c1x = w * 0.16, c2x = w * 0.84;
    return "M " + leftX.toFixed(1) + " " + baseY.toFixed(1) +
           " C " + c1x.toFixed(1) + " " + peakY.toFixed(1) + ", " +
                   c2x.toFixed(1) + " " + peakY.toFixed(1) + ", " +
                   rightX.toFixed(1) + " " + baseY.toFixed(1);
  }

  // Sample the master curve once, capturing position + outward normal at
  // each point, so every colour band can be derived from the same spine.
  function sampleMasterCurve(totalLen, count){
    var pts = [];
    var eps = Math.max(1, totalLen * 0.0015);
    for (var k = 0; k <= count; k++){
      var len = (k / count) * totalLen;
      var lenA = Math.max(0, len - eps);
      var lenB = Math.min(totalLen, len + eps);
      var p = measure.getPointAtLength(len);
      var a = measure.getPointAtLength(lenA);
      var b = measure.getPointAtLength(lenB);
      var tx = b.x - a.x, ty = b.y - a.y;
      var tl = Math.sqrt(tx * tx + ty * ty) || 1;
      tx /= tl; ty /= tl;
      // Rotated -90°: for this left-to-right arch this consistently
      // points "outward/up", away from the arc's concave underside —
      // the same direction real rainbows stack red (outer) past violet.
      pts.push({ x: p.x, y: p.y, nx: ty, ny: -tx });
    }
    return pts;
  }

  function buildBandPoints(basePts, offsetDist){
    var out = [];
    for (var i = 0; i < basePts.length; i++){
      var p = basePts[i];
      out.push({ x: p.x + p.nx * offsetDist, y: p.y + p.ny * offsetDist });
    }
    return out;
  }

  function pointsToD(pts){
    var d = "";
    for (var i = 0; i < pts.length; i++){
      d += (i === 0 ? "M " : "L ") + pts[i].x.toFixed(2) + " " + pts[i].y.toFixed(2) + " ";
    }
    return d;
  }

  function buildRainbow(){
    viewW = window.innerWidth;
    viewH = window.innerHeight;
    svg.setAttribute("viewBox", "0 0 " + viewW + " " + viewH);

    var thickness = bandThicknessFor(viewW, viewH);
    var totalBreadth = STAGES.length * thickness;
    var topClearance = totalBreadth + viewH * 0.06;

    measure.setAttribute("d", rainbowPathD(viewW, viewH, topClearance));
    var totalLen = measure.getTotalLength();
    var basePts = sampleMasterCurve(totalLen, 120);

    // Preserve current reveal state across rebuilds (e.g. on resize).
    var prevRevealed = segments.map(function(s, i){ return i <= state.stageIndex; });

    group.innerHTML = "";
    segments = [];

    for (var i = 0; i < STAGES.length; i++){
      // Band 0 (violet) sits closest to the spine; each later band is
      // stacked outward by one thickness, so the rainbow grows broader
      // — and more complete — with every tap.
      var offsetDist = (i + 0.5) * thickness;
      var bandPts = buildBandPoints(basePts, offsetDist);
      var d = pointsToD(bandPts);
      var len = polylineLength(bandPts);

      var path = document.createElementNS(SVGNS, "path");
      path.setAttribute("d", d);
      path.setAttribute("stroke-width", thickness + 0.5); // tiny overlap, no hairline gaps
      path.style.stroke = STAGES[i].color;

      var revealed = prevRevealed.length ? prevRevealed[i] : false;
      // No transition while we snap to the preserved state.
      path.style.transition = "none";
      path.style.strokeDasharray = len + " " + len;
      path.style.strokeDashoffset = revealed ? "0" : String(len);
      group.appendChild(path);

      // Re-enable transitions on the next frame so future reveals animate.
      (function(p){
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){
            p.style.transition = "stroke-dashoffset " +
              (reducedMotion ? 1200 : 1600) + "ms cubic-bezier(0.16,1,0.3,1), " +
              "stroke 2600ms ease";
          });
        });
      })(path);

      segments.push({ path: path, len: len });
    }

    // Re-apply the "converged to white" look after a rebuild mid/after final state.
    if (state.finalTriggered){
      segments.forEach(function(s){ s.path.style.stroke = "#ffffff"; });
    }
  }

  var resizeTimer = null;
  function onResize(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(buildRainbow, 120);
  }
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", onResize);

  // ---------------------------------------------------------------------
  // Breathing engine — fully independent of tap/stage state.
  // Phase model: inhale -> hold -> exhale -> rest, continuous, never reset.
  // Timing derived from the reference motion study (~4.5s in / ~4.5s out,
  // no hard pause, smooth accel/decel throughout).
  // ---------------------------------------------------------------------
  var PHASES = [
    { name: "inhale", dur: 4500 },
    { name: "hold",   dur: 500  },
    { name: "exhale", dur: 4300 },
    { name: "rest",   dur: 500  }
  ];
  var CYCLE = PHASES.reduce(function(sum, p){ return sum + p.dur; }, 0);

  var breathStartTime = null;

  function easeInOutSine(x){
    return -(Math.cos(Math.PI * x) - 1) / 2;
  }

  function breathValueAt(elapsed){
    var t = elapsed % CYCLE;
    var acc = 0;
    for (var i = 0; i < PHASES.length; i++){
      var p = PHASES[i];
      if (t < acc + p.dur){
        var local = (t - acc) / p.dur;
        if (p.name === "inhale") return easeInOutSine(local);
        if (p.name === "hold")   return 1;
        if (p.name === "exhale") return 1 - easeInOutSine(local);
        return 0; // rest
      }
      acc += p.dur;
    }
    return 0;
  }

  function breathingLoop(now){
    if (!state.breathingStarted) return;
    if (breathStartTime === null) breathStartTime = now;
    var eased = breathValueAt(now - breathStartTime);
    applyBreath(eased);
    requestAnimationFrame(breathingLoop);
  }

  function applyBreath(eased){
    var scaleAmp   = reducedMotion ? 0.015 : 0.09;
    var offsetAmp  = reducedMotion ? 0     : 5;
    var brightAmp  = reducedMotion ? 0.04  : 0.14;
    var glowBase   = 2, glowAmp = reducedMotion ? 1 : 7;
    var glowAlphaBase = 0.10, glowAlphaAmp = reducedMotion ? 0.05 : 0.24;

    var scale  = 1 + scaleAmp * eased;
    var offset = -offsetAmp * eased;
    var bright = 1 + brightAmp * eased;
    var glow   = glowBase + glowAmp * eased;
    var glowAlpha = glowAlphaBase + glowAlphaAmp * eased;

    group.style.transform = "translate(0px, " + offset.toFixed(2) + "px) scale(" + scale.toFixed(4) + ")";
    group.style.filter = "brightness(" + bright.toFixed(3) + ") drop-shadow(0 0 " +
      glow.toFixed(2) + "px rgba(255,255,255," + glowAlpha.toFixed(3) + "))";

    // The same breathing rhythm shows on the very first (pre-tap) screen
    // as a large, high-contrast pulse of light — sized and lit to be
    // easy to lock onto at a glance, including with narrowed or blurred
    // vision (e.g. during a panic attack), not just a subtle ambience.
    var glowScaleAmp = reducedMotion ? 0.04 : 0.22;
    var glowOpacityBase = 0.55, glowOpacityAmp = reducedMotion ? 0.10 : 0.40;
    var ringOpacityBase = 0.65, ringOpacityAmp = reducedMotion ? 0.08 : 0.30;
    var introScale = 1 + glowScaleAmp * eased;
    var introOpacity = glowOpacityBase + glowOpacityAmp * eased;
    var ringOpacity = ringOpacityBase + ringOpacityAmp * eased;
    var introTransform = "translate(-50%,-50%) scale(" + introScale.toFixed(4) + ")";
    introGlowInnerEl.style.transform = introTransform;
    introGlowInnerEl.style.opacity = introOpacity.toFixed(3);
    introGlowRingEl.style.transform = introTransform;
    introGlowRingEl.style.opacity = ringOpacity.toFixed(3);
  }

  function startBreathing(){
    if (state.breathingStarted) return;
    state.breathingStarted = true;
    requestAnimationFrame(breathingLoop);
  }

  // ---------------------------------------------------------------------
  // Stage progression
  // ---------------------------------------------------------------------
  function setLabel(text){
    labelEl.classList.add("hidden");
    setTimeout(function(){
      labelEl.textContent = text;
      labelEl.classList.remove("hidden");
    }, 320);
  }

  function announce(text){
    liveEl.textContent = text;
  }

  function revealSegment(i){
    state.animating = true;
    var seg = segments[i];
    // Force the transition to run from the current (hidden) offset to 0.
    seg.path.style.strokeDashoffset = "0";
    var revealTime = reducedMotion ? 1300 : 1750;
    setTimeout(function(){ state.animating = false; }, revealTime);
  }

  function revealStage(i){
    setLabel(STAGES[i].label);
    announce(STAGES[i].label);
    revealSegment(i);
  }

  function hideIntro(){
    emojiEl.style.opacity = "0";
    labelEl.classList.add("hidden");
    introGlowEl.classList.add("hidden");
  }

  function runFinalTransformation(){
    state.animating = true;
    announce("You Are Here");

    setTimeout(function(){
      // Converge every colour to a single luminous white line. The
      // breathing loop keeps running untouched throughout.
      segments.forEach(function(s){ s.path.style.stroke = "#ffffff"; });

      setTimeout(function(){
        finalText.classList.add("show");
        setTimeout(function(){
          finalHeart.classList.add("show");
          state.animating = false;
        }, 900);
      }, 2700);
    }, 300);
  }

  function resetExperience(){
    // Fade the completed white rainbow away, then silently rewind every
    // segment back to hidden so the next cycle draws in fresh. The
    // breathing loop is never paused or reset — it carries straight
    // through the loop, same as it carries through every tap.
    state.animating = true;
    finalText.classList.remove("show");
    finalHeart.classList.remove("show");
    announce("Returning to the beginning");

    group.style.transition = "opacity 1100ms ease";
    group.style.opacity = "0";

    setTimeout(function(){
      segments.forEach(function(s, i){
        s.path.style.transition = "none";
        s.path.style.stroke = STAGES[i].color;
        s.path.style.strokeDashoffset = String(s.len);
      });

      group.style.transition = "";
      group.style.opacity = "";

      segments.forEach(function(s){
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){
            s.path.style.transition = "stroke-dashoffset " +
              (reducedMotion ? 1200 : 1600) + "ms cubic-bezier(0.16,1,0.3,1), " +
              "stroke 2600ms ease";
          });
        });
      });

      state.stageIndex = -1;
      state.finalTriggered = false;

      labelEl.textContent = "Tap to Breathe";
      labelEl.classList.remove("hidden");
      emojiEl.style.opacity = "0.5";
      introGlowEl.classList.remove("hidden");
      announce("Tap to Breathe");

      state.animating = false;
    }, 1150);
  }

  // ---------------------------------------------------------------------
  // Input
  // ---------------------------------------------------------------------
  function onActivate(){
    if (state.animating) return;

    if (state.finalTriggered){
      resetExperience();
      return;
    }

    if (state.stageIndex === -1){
      state.stageIndex = 0;
      hideIntro();
      revealStage(0);
      return;
    }

    if (state.stageIndex < STAGES.length - 1){
      state.stageIndex++;
      revealStage(state.stageIndex);
      return;
    }

    // All seven colours are visible — this tap begins the arrival.
    state.finalTriggered = true;
    labelEl.classList.add("hidden");
    runFinalTransformation();
  }

  app.addEventListener("pointerup", function(e){
    onActivate();
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "Enter" || e.key === " " || e.code === "Space"){
      e.preventDefault();
      onActivate();
    }
  });

  // ---------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------
  buildRainbow();
  startBreathing(); // breathing is visible from the very first frame, pre-tap
  try { app.focus({ preventScroll: true }); } catch (e) {}
})();
</script>
</body>
</html>
