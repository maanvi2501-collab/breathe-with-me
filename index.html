<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>You Are Here</title>
<style>
  :root{
    color-scheme: dark;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #app{
    position: fixed;
    inset: 0;
    height: 100dvh;
    width: 100vw;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    outline: none;
  }

  svg#rainbow{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
  }

  #rainbowGroup{
    transform-box: fill-box;
    transform-origin: 50% 50%;
    will-change: transform, filter;
  }

  #rainbowGroup path{
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 2600ms ease;
  }

  .center{
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    pointer-events: none;
    text-align: center;
    padding: 0 8vw;
  }

  #emoji{
    font-size: 22px;
    line-height: 1;
    opacity: 0.5;
    filter: grayscale(1) brightness(2.3) contrast(0.55);
    transition: opacity 900ms ease;
  }

  #label{
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "Helvetica Neue", Arial, sans-serif;
    font-weight: 300;
    font-size: 15px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.82);
    transition: opacity 650ms ease;
  }
  #label.hidden{ opacity: 0; }

  #finalText{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    opacity: 0;
    transition: opacity 2000ms ease;
  }
  #finalText.show{ opacity: 1; }

  #finalLine{
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                 "Helvetica Neue", Arial, sans-serif;
    font-weight: 200;
    font-size: 18px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.92);
  }

  #finalHeart{
    font-size: 19px;
    opacity: 0;
    transition: opacity 1600ms ease;
  }
  #finalHeart.show{ opacity: 1; }

  #introGlow{
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 1;
    transition: opacity 900ms ease;
  }
  #introGlow.hidden{ opacity: 0; }

  #introGlowInner, #introGlowRing{
    position: absolute;
    top: 50%;
    left: 50%;
    border-radius: 50%;
    will-change: transform, opacity;
  }

  #introGlowInner{
    width: min(64vw, 64vh, 340px);
    height: min(64vw, 64vh, 340px);
    background: radial-gradient(circle,
      rgba(255,255,255,0.60) 0%,
      rgba(255,255,255,0.34) 42%,
      rgba(255,255,255,0.10) 70%,
      rgba(255,255,255,0) 88%);
    transform: translate(-50%,-50%) scale(1);
  }

  #introGlowRing{
    width: min(64vw, 64vh, 340px);
    height: min(64vw, 64vh, 340px);
    border: max(2px, 0.4vw) solid rgba(255,255,255,0.9);
    box-shadow: 0 0 24px rgba(255,255,255,0.45);
    transform: translate(-50%,-50%) scale(1);
  }

  .sr-only{
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  @media (prefers-reduced-motion: reduce){
    #rainbowGroup path{ transition-duration: 1200ms; }
  }
</style>
</head>
<body>

<div id="app" role="button" tabindex="0" aria-label="Tap anywhere to begin the breathing experience">

  <svg id="rainbow" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <path id="measure" d=""></path>
    </defs>
    <g id="rainbowGroup"></g>
  </svg>

  <div id="introGlow" aria-hidden="true"><div id="introGlowInner"></div><div id="introGlowRing"></div></div>

  <div class="center">
    <div id="emoji">&#128543;</div>
    <div id="label">Tap to Breathe</div>
    <div id="finalText">
      <div id="finalLine">You Are Here</div>
      <div id="finalHeart">&#10084;&#65039;</div>
    </div>
  </div>

  <div id="live" class="sr-only" aria-live="polite"></div>
</div>

<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------------
  // Data
  // ---------------------------------------------------------------------
  var STAGES = [
    { label: "Your Kindness", color: "#8B5CF6" },
    { label: "Your Joy",      color: "#4F8CFF" },
    { label: "Your Friends",  color: "#22D3EE" },
    { label: "Your Family",   color: "#34D399" },
    { label: "Your Love",     color: "#FDE047" },
    { label: "Your Life",     color: "#FB923C" },
    { label: "Your Future",   color: "#F43F5E" }
  ];

  var SVGNS = "http://www.w3.org/2000/svg";

  // ---------------------------------------------------------------------
  // DOM refs
  // ---------------------------------------------------------------------
  var app        = document.getElementById("app");
  var svg        = document.getElementById("rainbow");
  var measure      = document.getElementById("measure");
  var group        = document.getElementById("rainbowGroup");
  var emojiEl      = document.getElementById("emoji");
  var labelEl      = document.getElementById("label");
  var finalText    = document.getElementById("finalText");
  var finalHeart   = document.getElementById("finalHeart");
  var liveEl       = document.getElementById("live");
  var introGlowEl  = document.getElementById("introGlow");
  var introGlowInnerEl = document.getElementById("introGlowInner");
  var introGlowRingEl  = document.getElementById("introGlowRing");

  // ---------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------
  var state = {
    stageIndex: -1,      // -1 = not started, 0..6 = revealed stages
    animating: false,    // true while a reveal transition is in-flight
    breathingStarted: false,
    finalTriggered: false
  };

  var reducedMotion = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var segments = [];   // { path, len }
  var viewW = 0, viewH = 0;

  // ---------------------------------------------------------------------
  // Geometry: a broad rainbow band — seven stacked, offset colour arcs
  // that together read as one wide sweep, rather than a single thin line.
  // ---------------------------------------------------------------------
  function polylineLength(pts){
    var total = 0;
    for (var i = 1; i < pts.length; i++){
      var dx = pts[i].x - pts[i-1].x;
      var dy = pts[i].y - pts[i-1].y;
      total += Math.sqrt(dx*dx + dy*dy);
    }
    return total;
  }

  function bandThicknessFor(w, h){
    var ref = Math.min(w, h);
    return Math.max(12, Math.min(30, ref * 0.026));
  }

  function rainbowPathD(w, h, topClearance){
    var ref = Math.min(w, h * 1.4);
    var extend = ref * 0.24;
    var leftX = -extend;
    var rightX = w + extend;
    var baseY = h * 0.72;
    var peakY = Math.max(topClearance, baseY - ref * 0.58);
    var c1x = w * 0.16, c2x = w * 0.84;
    return "M " + leftX.toFixed(1) + " " + baseY.toFixed(1) +
           " C " + c1x.toFixed(1) + " " + peakY.toFixed(1) + ", " +
                   c2x.toFixed(1) + " " + peakY.toFixed(1) + ", " +
                   rightX.toFixed(1) + " " + baseY.toFixed(1);
  }

  // Sample the master curve once, capturing position + outward normal at
  // each point, so every colour band can be derived from the same spine.
  function sampleMasterCurve(totalLen, count){
    var pts = [];
    var eps = Math.max(1, totalLen * 0.0015);
    for (var k = 0; k <= count; k++){
      var len = (k / count) * totalLen;
      var lenA = Math.max(0, len - eps);
      var lenB = Math.min(totalLen, len + eps);
      var p = measure.getPointAtLength(len);
      var a = measure.getPointAtLength(lenA);
      var b = measure.getPointAtLength(lenB);
      var tx = b.x - a.x, ty = b.y - a.y;
      var tl = Math.sqrt(tx * tx + ty * ty) || 1;
      tx /= tl; ty /= tl;
      // Rotated -90°: for this left-to-right arch this consistently
      // points "outward/up", away from the arc's concave underside —
      // the same direction real rainbows stack red (outer) past violet.
      pts.push({ x: p.x, y: p.y, nx: ty, ny: -tx });
    }
    return pts;
  }

  function buildBandPoints(basePts, offsetDist){
    var out = [];
    for (var i = 0; i < basePts.length; i++){
      var p = basePts[i];
      out.push({ x: p.x + p.nx * offsetDist, y: p.y + p.ny * offsetDist });
    }
    return out;
  }

  function pointsToD(pts){
    var d = "";
    for (var i = 0; i < pts.length; i++){
      d += (i === 0 ? "M " : "L ") + pts[i].x.toFixed(2) + " " + pts[i].y.toFixed(2) + " ";
    }
    return d;
  }

  function buildRainbow(){
    viewW = window.innerWidth;
    viewH = window.innerHeight;
    svg.setAttribute("viewBox", "0 0 " + viewW + " " + viewH);

    var thickness = bandThicknessFor(viewW, viewH);
    var totalBreadth = STAGES.length * thickness;
    var topClearance = totalBreadth + viewH * 0.06;

    measure.setAttribute("d", rainbowPathD(viewW, viewH, topClearance));
    var totalLen = measure.getTotalLength();
    var basePts = sampleMasterCurve(totalLen, 120);

    // Preserve current reveal state across rebuilds (e.g. on resize).
    var prevRevealed = segments.map(function(s, i){ return i <= state.stageIndex; });

    group.innerHTML = "";
    segments = [];

    for (var i = 0; i < STAGES.length; i++){
      // Band 0 (violet) sits closest to the spine; each later band is
      // stacked outward by one thickness, so the rainbow grows broader
      // — and more complete — with every
